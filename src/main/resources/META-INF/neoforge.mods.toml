modLoader = "javafml"
loaderVersion = "[4,)"
license = "${license}"

[[mods]]
modId = "${id}"
version = "${version}"
displayName = "${name}"
logoFile = "assets/${id}/icon.png"
description = '''${description}'''
authors = "Bawnorton"
issueTrackerURL = "https://github.com/Bawnorton/${name}/issues"

[[mixins]]
config = "${id}.mixin.json"

[[mixins]]
config = "${id}.client.mixin.json"

[[dependencies."${id}"]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies."${id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${id}"]]
modId = "yet_another_config_lib_v3"
type = "required"
versionRange = "[3.8.2,)"
ordering = "NONE"
side = "BOTH"

[[dependencies."${id}"]]
modId = "tacz"
type = "required"
versionRange = "[1.2.0,1.2.1)"
ordering = "NONE"
side = "BOTH"
